<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N.I.N.A. Remote Telemetry</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="favicon.svg" alt="" width="24" height="24" />
        <span>N.I.N.A. Remote Telemetry</span>
      </div>
      <select id="viewSelect" aria-label="View"></select>
      <nav id="deviceChips" class="chips" aria-label="NINA devices"></nav>
      <div class="actions">
        <button id="addCardBtn" type="button" class="primary" hidden>
          Add card
        </button>
        <button id="editBtn" type="button" hidden>Edit layout</button>
        <select
          id="timeMode"
          aria-label="Time zone for displayed times"
          title="Show times in each observatory's local time, or in your own time zone"
        >
          <option value="observatory">Observatory time</option>
          <option value="local">My time</option>
        </select>
        <button id="nightBtn" type="button" title="Toggle red night mode">
          Night
        </button>
        <button id="manageBtn" type="button">Devices</button>
      </div>
    </header>

    <main id="empty" class="empty" hidden>
      <h1>No NINA devices yet</h1>
      <p>
        Add a NINA instance running the Remote Telemetry plugin, e.g.
        <code>http://100.xx.x.xx:8787</code> or
        <code>http://hostname:8787</code>.
      </p>
      <button id="emptyAddBtn" type="button" class="primary">Add device</button>
    </main>

    <main id="view" class="grid"></main>

    <dialog id="devicesDialog">
      <form method="dialog" class="dialog">
        <h2>NINA devices</h2>
        <ul id="deviceList" class="devicelist"></ul>
        <fieldset>
          <legend>Add device</legend>
          <label
            >Name <input id="newName" placeholder="Observatory" maxlength="60"
          /></label>
          <label
            >Address <input id="newUrl" placeholder="http://100.xx.x.xx:8787"
          /></label>
          <label
            >API key
            <input id="newKey" placeholder="(optional)" autocomplete="off"
          /></label>
          <p id="addError" class="error" hidden></p>
          <button id="addBtn" type="button" class="primary">
            Test &amp; add
          </button>
        </fieldset>
        <div class="right">
          <button value="close" formnovalidate>Close</button>
        </div>
      </form>
    </dialog>

    <dialog id="cardDialog">
      <form method="dialog" class="dialog">
        <h2>Add card</h2>
        <label class="field"
          >Card
          <select id="cardType"></select
        ></label>
        <label class="field"
          >From NINA
          <select id="cardDevice"></select
        ></label>
        <div class="right">
          <button value="cancel" formnovalidate>Cancel</button>
          <button id="cardAddBtn" type="button" class="primary">Add</button>
        </div>
      </form>
    </dialog>

    <dialog id="snapDialog">
      <form method="dialog" class="dialog">
        <h2>Snapshot</h2>
        <img id="snapImg" class="snap-preview" alt="Card snapshot" />
        <p id="snapNote" class="muted small" hidden></p>
        <div class="right">
          <button id="snapCopy" type="button">Copy to clipboard</button>
          <button id="snapSave" type="button" class="primary">Save JPG</button>
          <button value="close" formnovalidate>Close</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
